<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Masitech Solutions</title>

    <style>
        :root {
            --charcoal: #374151;
            --dark-charcoal: #1f2937;
            --blue: #2563eb;
            --dark-blue: #1d4ed8;
            --teal: #2563eb;
            --dark-teal: #1d4ed8;
            --light-grey: #f3f4f6;
            --medium-grey: #6b7280;
            --white: #ffffff;
            --border: #d1d5db;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --shadow: 0 12px 35px rgba(31, 41, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--dark-charcoal);
            background: var(--light-grey);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .site-header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            width: min(1120px, calc(100% - 40px));
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark-charcoal);
            font-weight: 700;
        }

        .brand img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 9px;
        }

        .back-link {
            color: var(--teal);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 55px 20px;
        }

        .login-card {
            width: min(100%, 450px);
            padding: 34px;
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .login-heading {
            margin-bottom: 26px;
            text-align: center;
        }

        .login-heading h1 {
            margin-bottom: 8px;
            color: var(--dark-charcoal);
            font-size: 2rem;
        }

        .login-heading p {
            color: var(--medium-grey);
            font-size: 0.95rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            color: var(--charcoal);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            min-height: 48px;
            padding: 0 13px;
            color: var(--dark-charcoal);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .password-row a {
            color: var(--teal);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .password-row a:hover {
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            min-height: 48px;
            margin-top: 5px;
            color: var(--white);
            background: var(--teal);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
        }

        .submit-button:hover {
            background: var(--dark-teal);
        }

        .submit-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: var(--medium-grey);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .google-button {
            width: 100%;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--dark-charcoal);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .google-button:hover {
            border-color: var(--teal);
            color: var(--teal);
        }

        .google-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .google-button svg {
            width: 18px;
            height: 18px;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .message.error {
            display: block;
            color: var(--error-text);
            background: var(--error-bg);
        }

        .message.success {
            display: block;
            color: var(--success-text);
            background: var(--success-bg);
        }

        .signup-prompt {
            margin-top: 25px;
            color: var(--medium-grey);
            text-align: center;
            font-size: 0.92rem;
        }

        .signup-prompt a {
            color: var(--teal);
            font-weight: 700;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        .site-footer {
            padding: 22px 20px;
            color: #9ca3af;
            background: var(--dark-charcoal);
            text-align: center;
            font-size: 0.85rem;
        }

        @media (max-width: 520px) {
            .header-content {
                width: min(100% - 28px, 1120px);
            }

            .brand span {
                max-width: 170px;
                font-size: 0.92rem;
            }

            .back-link {
                font-size: 0.85rem;
            }

            .login-card {
                padding: 26px 20px;
            }

            .password-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <a
                class="brand"
                href="index.html"
                aria-label="Masitech Solutions home"
            >
                <img
                    src="logo.jpg"
                    alt="Masitech Solutions logo"
                >

                <span>Masitech Solutions</span>
            </a>

            <a class="back-link" href="index.html">
                Back to home
            </a>
        </div>
    </header>

    <main>
        <section
            class="login-card"
            aria-labelledby="loginTitle"
        >
            <div class="login-heading">
                <h1 id="loginTitle">Welcome back</h1>

                <p>
                    Log in to access your accommodation dashboard.
                </p>
            </div>

            <div
                class="message"
                id="message"
                role="alert"
            ></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-row">
                        <label for="password">
                            Password
                        </label>

                        <a href="forgot-password.html">
                            Forgot password?
                        </a>
                    </div>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    class="submit-button"
                    id="loginButton"
                    type="submit"
                >
                    Log in
                </button>
            </form>

            <div class="divider">or</div>

            <button class="google-button" id="googleLoginButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.8 0 3 .7 3.7 1.4l2.5-2.4C16.8 3.8 14.6 3 12 3 6.9 3 2.8 7.1 2.8 12.2S6.9 21.4 12 21.4c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12z"/>
                </svg>
                Continue with Google
            </button>

            <p class="signup-prompt">
                Do not have an account?
                <a href="signup.html">Create one</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        © <span id="currentYear"></span>
        Masitech Solutions. All rights reserved.
    </footer>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDg6FOKfNMkj1L-UyxkGqEpPuyw76jLq_c",
            authDomain: "masitech-solutions.firebaseapp.com",
            projectId: "masitech-solutions",
            storageBucket: "masitech-solutions.firebasestorage.app",
            messagingSenderId: "627121817663",
            appId: "1:627121817663:web:1d8bc441f6a2daf83bd08a",
            measurementId: "G-LZQQCZTF1M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Higher priority roles win only when that role is actually on the account
        const ROLE_PRIORITY = [
            "super-admin",
            "main-admin",
            "sub-admin",
            "content-admin",
            "property-admin",
            "user-admin",
            "analytics-admin",
            "location-admin",
            "caretaker",
            "student",
            "tenant"
        ];

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");
        const googleLoginButton = document.getElementById("googleLoginButton");

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function hideMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function getRolesFromProfile(profile) {
            if (Array.isArray(profile.roles) && profile.roles.length) {
                return profile.roles.map(String);
            }
            if (profile.role) {
                return [String(profile.role)];
            }
            return [];
        }

        function getRolesFromClaims(claims) {
            if (Array.isArray(claims.roles) && claims.roles.length) {
                return claims.roles.map(String);
            }
            if (claims.role) {
                return [String(claims.role)];
            }
            return [];
        }

        function getEffectiveRoles(profile, claims) {
            return [
                ...new Set([
                    ...getRolesFromProfile(profile),
                    ...getRolesFromClaims(claims)
                ])
            ];
        }

        function getDashboardForRoles(roles) {
            const selectedRole = ROLE_PRIORITY.find((role) =>
                roles.includes(role)
            );

            switch (selectedRole) {
                case "super-admin":
                case "main-admin":
                case "sub-admin":
                case "content-admin":
                case "property-admin":
                case "user-admin":
                case "analytics-admin":
                case "location-admin":
                    return "admin.html";
                case "caretaker":
                    return "caretaker.html";
                case "student":
                    return "student-dashboard.html";
                case "tenant":
                    return "tenant-dashboard.html";
                default:
                    return "profile.html";
            }
        }

        function friendlyAuthError(error) {
            const code = error?.code || "";
            if (
                code === "auth/invalid-credential" ||
                code === "auth/user-not-found" ||
                code === "auth/wrong-password"
            ) {
                return "The email or password is incorrect.";
            }
            if (code === "auth/invalid-email") {
                return "Please enter a valid email address.";
            }
            if (code === "auth/too-many-requests") {
                return "Too many failed attempts. Please wait and try again later.";
            }
            if (code === "auth/network-request-failed") {
                return "Network error. Please check your internet connection.";
            }
            if (code === "auth/user-disabled") {
                return "This account has been disabled. Please contact support.";
            }
            if (code === "auth/popup-closed-by-user") {
                return "The sign-in window was closed before finishing.";
            }
            if (code === "auth/popup-blocked") {
                return "Your browser blocked the sign-in window. Allow pop-ups and try again.";
            }
            if (code === "auth/account-exists-with-different-credential") {
                return "An account already exists with this email using another sign-in method.";
            }
            return "We could not log you in. Please check your details and try again.";
        }

        async function resolveDestination(user) {
            const profileSnapshot = await getDoc(doc(db, "users", user.uid));
            const profile = profileSnapshot.exists()
                ? profileSnapshot.data()
                : {};

            let claims = {};
            try {
                const tokenResult = await user.getIdTokenResult(true);
                claims = tokenResult.claims || {};
            } catch (claimError) {
                console.warn("Could not load custom claims:", claimError);
            }

            const roles = getEffectiveRoles(profile, claims);

            // Incomplete profile → finish setup
            if (
                profile.profileComplete === false ||
                (!String(profile.fullName || "").trim() && roles.length === 0)
            ) {
                return "profile.html?complete=1";
            }

            return getDashboardForRoles(roles);
        }

        async function redirectAfterLogin(user) {
            try {
                const destination = await resolveDestination(user);
                window.location.replace(destination);
            } catch (error) {
                console.error("Redirect error:", error);
                // Auth succeeded but profile read failed — send to profile, not admin
                showMessage(
                    "You are signed in. Opening your profile to finish setup.",
                    "success"
                );
                setTimeout(() => {
                    window.location.replace("profile.html");
                }, 800);
            }
        }

        async function ensureGoogleProfile(user) {
            const ref = doc(db, "users", user.uid);
            const snap = await getDoc(ref);

            if (snap.exists()) {
                return snap.data();
            }

            const profile = {
                uid: user.uid,
                fullName: user.displayName || "",
                email: user.email || "",
                phone: "",
                role: "student",
                roles: ["student"],
                permissions: [],
                locationId: "",
                locationIds: [],
                accountStatus: "active",
                profileComplete: false,
                authProvider: "google",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            };

            await setDoc(ref, profile, { merge: true });
            return profile;
        }

        /*
         * Do NOT auto-redirect on page load.
         * A previous browser session must not skip the login form
         * or send someone to the wrong dashboard.
         * User must re-enter credentials (or use Google) to continue.
         */
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideMessage();

            const email = document
                .getElementById("email")
                .value
                .trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showMessage("Please enter your email and password.", "error");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                // Always sign in with the credentials typed in the form
                // so a previous session cannot override the account.
                if (auth.currentUser) {
                    try {
                        await signOut(auth);
                    } catch (e) {
                        console.warn(e);
                    }
                }

                const credentials = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                showMessage("Login successful. Redirecting...", "success");
                await redirectAfterLogin(credentials.user);
            } catch (error) {
                console.error("Login error:", error);
                showMessage(friendlyAuthError(error), "error");
                loginButton.disabled = false;
                loginButton.textContent = "Log in";
            }
        });

        googleLoginButton.addEventListener("click", async () => {
            hideMessage();
            googleLoginButton.disabled = true;

            try {
                if (auth.currentUser) {
                    try {
                        await signOut(auth);
                    } catch (e) {
                        console.warn(e);
                    }
                }

                const result = await signInWithPopup(auth, googleProvider);
                await ensureGoogleProfile(result.user);
                showMessage("Login successful. Redirecting...", "success");
                await redirectAfterLogin(result.user);
            } catch (error) {
                console.error("Google login error:", error);
                showMessage(friendlyAuthError(error), "error");
            } finally {
                googleLoginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
